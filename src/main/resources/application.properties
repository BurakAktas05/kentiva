# ============================================================
#  Uygulama Adı
# ============================================================
spring.application.name=BelediyeApp
spring.profiles.active=dev

# Proje kökündeki .env (APP_* vb.) — yoksa yok sayılır
spring.config.import=optional:file:.env[.properties]

# ============================================================
#  Veritabanı (PostgreSQL + PostGIS)
#  Railway varsayılan olarak DATABASE_URL sağlar.
# ============================================================
spring.datasource.url=${BELEDIYE_DB_URL:jdbc:postgresql://localhost:5432/belediyeapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2457}
spring.datasource.driver-class-name=org.postgresql.Driver

# Bağlantı havuzu (HikariCP)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
#  JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ============================================================
#  Flyway (DB Migration)
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.clean-on-validation-error=false

# ============================================================
#  JWT Ayarları
#  Üretim ortamında env variable ile override edilmeli!
# ============================================================
app.security.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5Zm9yIElCQiBiZWxlZGl5ZWFwcA==}
app.security.jwt.access-token-expiration-ms=${APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.security.jwt.refresh-token-expiration-days=${APP_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}

# ============================================================
#  CORS / WebSocket
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174,https://localhost}
app.websocket.enabled=${APP_WEBSOCKET_ENABLED:false}
app.websocket.allowed-origins=${APP_WEBSOCKET_ALLOWED_ORIGINS:${app.cors.allowed-origins}}

# Ngrok / ters vekil: yerel /uploads yanıtını tam URL yap (APK önizleme). Örn. https://abc.ngrok-free.app
app.public-base-url=${APP_PUBLIC_URL:}

# ============================================================
#  Dosya Depolama
# ============================================================
app.storage.type=${APP_STORAGE_TYPE:local}
# Yerel disk: göreli veya mutlak yol (ör. C:/Users/you/proj/uploads). APP_STORAGE_LOCAL_UPLOAD_DIR ile .env'den verilebilir.
app.storage.local.upload-dir=${APP_STORAGE_LOCAL_UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=48MB

# ============================================================
#  Swagger UI / OpenAPI
#  Prod'da app.swagger.enabled=false ile kapatılabilir.
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.enabled=${APP_SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${APP_SWAGGER_ENABLED:true}

# ============================================================
#  Loglama
# ============================================================
logging.level.com.burak.belediyeapp=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ============================================================
#  Actuator / Health
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ============================================================
#  Async (NotificationService için)
# ============================================================
spring.task.execution.pool.core-size=3
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# ================================
#  STORAGE (Cloudflare R2)
# ================================
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.bucket-name=${S3_BUCKET_NAME:belediye-reports}
app.storage.s3.region=${S3_REGION:auto}
app.storage.s3.public-url=${S3_PUBLIC_URL:https://pub.r2.dev}

# ================================
#  REDIS (Opsiyonel — varsayılan kapalı)
# ================================
app.cache.type=${APP_CACHE_TYPE:none}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ================================
#  AI (Google Gemini)
# ================================
app.ai.gemini.api-key=${GEMINI_API_KEY:}

# Firebase service account JSON, Base64 encoded.
app.firebase.config-base64=${FIREBASE_CONFIG_BASE64:}

# ================================
#  Medya doğrulama (Python media-guard — boş bırakılırsa atlanır)
# ================================
app.media-guard.base-url=${MEDIA_GUARD_URL:}
app.media-guard.fail-open=${MEDIA_GUARD_FAIL_OPEN:true}

# ================================
#  Server (Railway PORT desteği)
# ================================
server.port=${PORT:8080}
