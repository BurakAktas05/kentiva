# ============================================================
#  PROD profili — Railway / Production ortamı
# ============================================================

# Railway PostgreSQL bağlantısı DATABASE_URL ile gelir
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway: sadece resmi migration'lar (dev seed yok)
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Swagger: KAPALI (güvenlik)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Loglama
logging.level.com.burak.belediyeapp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN

# Storage: S3/R2 kullan
app.storage.type=s3

# WebSocket: aktif
app.websocket.enabled=true

