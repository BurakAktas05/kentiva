# ============================================================
#  PROD profili — Railway / Production ortamı
# ============================================================

# Railway PostgreSQL bağlantısı DATABASE_URL ile gelir
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway: sadece resmi migration'lar (dev seed yok)
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Swagger: KAPALI (güvenlik)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Loglama
logging.level.com.burak.belediyeapp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN

# Storage: S3/R2 kullan
app.storage.type=s3

# WebSocket: aktif
app.websocket.enabled=true

# HTTP response sıkıştırma (JSON/HTML)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Dışa aktarma üst sınırı (bellek koruması)
app.export.max-rows=10000

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Güvenlik (Hata Ayrıntılarını Gizleme)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Resilience4j Configurations
# Firebase Push Notification Retry
resilience4j.retry.instances.firebasePush.max-attempts=3
resilience4j.retry.instances.firebasePush.wait-duration=2s
resilience4j.retry.instances.firebasePush.retry-exceptions=java.lang.Exception

# SMS Sender Retry and Circuit Breaker
resilience4j.retry.instances.sms.max-attempts=3
resilience4j.retry.instances.sms.wait-duration=1s
resilience4j.retry.instances.sms.retry-exceptions=java.lang.Exception

resilience4j.circuitbreaker.instances.sms.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sms.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.sms.sliding-window-size=10
resilience4j.circuitbreaker.instances.sms.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.sms.permitted-number-of-calls-in-half-open-state=3

# Actuator Health Details
management.endpoint.health.show-details=when_authorized


# Önbellek: tek instance için none yeterli; çok replika / yüksek trafikte redis
# app.cache.type=redis
# REDIS_URL=redis://...  (Railway Redis eklentisi otomatik verir)

