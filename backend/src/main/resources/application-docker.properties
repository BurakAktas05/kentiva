# Docker Compose profili — yerel demo / arkadaş kurulumu

spring.flyway.locations=classpath:db/migration,classpath:db/dev-migration
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate

app.storage.type=local
app.storage.local.upload-dir=/app/uploads
app.websocket.enabled=true
app.messaging.rabbit.enabled=true
management.health.rabbit.enabled=true

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

logging.level.com.burak.belediyeapp=INFO
