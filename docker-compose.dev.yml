# Kentiva — Yerel Geliştirme Ortamı (PostgreSQL + Redis + API + Admin Portal)
# Kullanım: cp .env.docker.example .env.docker && docker compose -f docker-compose.dev.yml --env-file .env.docker up --build

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: belediyeapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d belediyeapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-kentiva}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-kentiva-dev}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitdata_dev:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: belediyeapp
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-jwt-secret-min-32-chars-long!!}
      APP_SETUP_TOKEN: ${APP_SETUP_TOKEN:-docker-local-setup}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*,http://127.0.0.1:*
      APP_STORAGE_TYPE: local
      APP_STORAGE_LOCAL_UPLOAD_DIR: /app/uploads
      APP_SWAGGER_ENABLED: "true"
      # Redis Cache Configuration
      APP_CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      APP_MESSAGING_RABBIT_ENABLED: "true"
      RABBITMQ_LISTENER_ENABLED: "true"
      RABBITMQ_HEALTH_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-kentiva}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-kentiva-dev}
      MEDIA_GUARD_URL: http://media-guard:8000
    volumes:
      - uploads_dev:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      media-guard:
        condition: service_started

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin-portal
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080/api/v1}
    ports:
      - "${ADMIN_PORT:-5173}:80"
    depends_on:
      - api

  media-guard:
    build:
      context: ./services/media-guard
      dockerfile: Dockerfile
    ports:
      - "${MEDIA_GUARD_PORT:-8001}:8000"
    environment:
      MAX_FACE_COVERAGE: "0.22"

volumes:
  pgdata_dev:
  redisdata_dev:
  rabbitdata_dev:
  uploads_dev:
