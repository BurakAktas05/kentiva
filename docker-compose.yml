# Kentiva — yerel tam yığın (PostgreSQL + API + Admin + Vatandaş web)
# Kullanım: cp .env.docker.example .env.docker && docker compose --env-file .env.docker up --build

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: belediyeapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d belediyeapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-kentiva}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-kentiva-dev}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kentiva-dev-redis}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: belediyeapp
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-jwt-secret-min-32-chars-long!!}
      APP_SETUP_TOKEN: ${APP_SETUP_TOKEN:-docker-local-setup}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*,http://127.0.0.1:*
      APP_STORAGE_TYPE: local
      APP_STORAGE_LOCAL_UPLOAD_DIR: /app/uploads
      APP_SWAGGER_ENABLED: "true"
      APP_MESSAGING_RABBIT_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-kentiva}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-kentiva-dev}
      APP_CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kentiva-dev-redis}
      MEDIA_GUARD_URL: http://media-guard:8000
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-guard:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin-portal
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080/api/v1}
    ports:
      - "${ADMIN_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  citizen:
    build:
      context: .
      dockerfile: docker/Dockerfile.citizen
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "${CITIZEN_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  media-guard:
    build:
      context: ./services/media-guard
      dockerfile: Dockerfile
    ports:
      - "${MEDIA_GUARD_PORT:-8001}:8000"
    environment:
      MAX_FACE_COVERAGE: "0.22"
      MAX_IMAGE_BYTES: "12582912"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  rabbitdata:
  redisdata:
  uploads:
