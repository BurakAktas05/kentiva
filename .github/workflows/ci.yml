name: Kentiva CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and Test Backend
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean test

  frontend-quality:
    name: Frontend Quality (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin-portal, belediyehattı, public-site]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install Dependencies
        run: |
          cd "${{ matrix.app }}"
          npm ci
      - name: Run Frontend Tests
        run: |
          cd "${{ matrix.app }}"
          npm test
      - name: Run Frontend Lint
        run: |
          cd "${{ matrix.app }}"
          npm run lint
      - name: Build Frontend
        run: |
          cd "${{ matrix.app }}"
          npm run build

  e2e-smoke:
    name: E2E Smoke (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: Run smoke (skips without E2E_* secrets)
        run: |
          cd e2e
          npm test
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_CITIZEN_URL: ${{ secrets.E2E_CITIZEN_URL }}
          E2E_ADMIN_URL: ${{ secrets.E2E_ADMIN_URL }}
          E2E_CITIZEN_EMAIL: ${{ secrets.E2E_CITIZEN_EMAIL }}
          E2E_CITIZEN_PASSWORD: ${{ secrets.E2E_CITIZEN_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_CATEGORY_ID: ${{ secrets.E2E_CATEGORY_ID }}
          E2E_MUNICIPALITY_ID: ${{ secrets.E2E_MUNICIPALITY_ID }}
